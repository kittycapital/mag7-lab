name: Update Mag 7 Data

on:
  schedule:
    - cron: '0 22 * * *'  # 7 AM KST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Mag 7 data
        run: python fetch_mag7.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Update Mag 7 data $(date -u +%Y-%m-%d)"
          git push
